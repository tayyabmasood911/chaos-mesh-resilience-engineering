<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; }
      .group-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; fill: #64748b; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #0f172a; }
      .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .node-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 500; fill: #0284c7; }
      .solid-arrow { stroke: #0284c7; stroke-width: 2; fill: none; }
      .chaos-arrow { stroke: #e11d48; stroke-width: 2; fill: none; }
      .feedback-arrow { stroke: #0d9488; stroke-width: 2; stroke-dasharray: 4,4; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488" />
    </marker>
  </defs>

  <!-- Header Section -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="1080" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="30" y="32" class="title">Chaos Mesh Resilience Engineering Architecture</text>
    <text x="30" y="52" class="subtitle">Cloud-Native Fault Injections (PodChaos, NetworkChaos, StressChaos), Automated Workflows &amp; SLO Guardrails</text>
    <rect x="910" y="22" width="140" height="26" rx="13" fill="#e11d48"/>
    <text x="980" y="39" text-anchor="middle" class="badge-text">RESILIENCE VALIDATED</text>
  </g>

  <!-- 1. Control Plane & Orchestration -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="240" height="500" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="20" y="30" class="group-title">1. Chaos Control Plane</text>

    <!-- Chaos Controller Manager -->
    <g transform="translate(15, 55)">
      <rect width="210" height="110" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <circle cx="25" cy="25" r="10" fill="#e0f2fe"/>
      <path d="M 21 27 L 25 18 L 29 27 Z" fill="#0284c7"/>
      <text x="45" y="24" class="node-title">Chaos Controller</text>
      <text x="45" y="38" class="node-desc">Reconciles CRDs &amp; Schedules</text>
      <text x="20" y="65" class="node-desc">Watches Chaos CRD Events</text>
      <text x="20" y="80" class="node-desc">Validates RBAC &amp; Namespaces</text>
      <text x="20" y="98" class="node-tag">Leader-Elected Multi-Node</text>
    </g>

    <!-- Chaos Daemon -->
    <g transform="translate(15, 180)">
      <rect width="210" height="135" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
      <rect x="15" y="15" width="24" height="24" rx="4" fill="#ede9fe"/>
      <text x="27" y="32" text-anchor="middle" style="font-family: sans-serif; font-size: 11px; font-weight:bold; fill:#6366f1;">D</text>
      <text x="48" y="24" class="node-title">Chaos-Daemon (DaemonSet)</text>
      <text x="48" y="38" class="node-desc">Node-Level Privileged Agent</text>
      <text x="15" y="65" class="node-desc">• Linux cgroups / eBPF hooks</text>
      <text x="15" y="82" class="node-desc">• tc-netem (Traffic Control)</text>
      <text x="15" y="99" class="node-desc">• iptables packet drop rules</text>
      <text x="15" y="118" class="node-tag" style="fill:#6366f1;">Kernel-Level Interception</text>
    </g>

    <!-- Automated Runner -->
    <g transform="translate(15, 330)">
      <rect width="210" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="15" y="24" class="node-title">Python Safety Runner</text>
      <text x="15" y="42" class="node-desc">scripts/chaos_runner.py</text>
      <text x="15" y="65" class="node-desc">• Automated Pre-flight checks</text>
      <text x="15" y="85" class="node-desc">• Continuous SLI Error Budget</text>
      <text x="15" y="105" class="node-desc">• Auto-Rollback Circuit Breaker</text>
      <text x="15" y="125" class="node-desc">• JUnit / JSON Test Reports</text>
    </g>
  </g>

  <!-- Arrow: Control Plane -> Primitives -->
  <path d="M 300 320 L 360 320" class="solid-arrow" marker-end="url(#arrow)"/>

  <!-- 2. Fault Injection CRDs (Primitives) -->
  <g transform="translate(360, 140)">
    <rect x="0" y="0" width="370" height="500" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="25" y="30" class="group-title">2. Chaos Injection Primitives (CRDs)</text>

    <!-- PodChaos -->
    <g transform="translate(20, 55)">
      <rect width="330" height="95" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="1.5"/>
      <rect x="15" y="15" width="26" height="26" rx="4" fill="#ffe4e6"/>
      <text x="28" y="33" text-anchor="middle" style="font-family: sans-serif; font-size: 12px; font-weight:bold; fill:#be123c;">P</text>
      <text x="50" y="26" class="node-title">PodChaos (pod-kill / pod-failure)</text>
      <text x="50" y="40" class="node-tag" style="fill:#be123c;">AVAILABILITY TESTING</text>
      <text x="15" y="65" class="node-desc">Simulates sudden container crashes and ungraceful pod termination</text>
      <text x="15" y="82" class="node-desc">Tests Kubelet restart policies, replica sets, and load balancer drain</text>
    </g>

    <!-- NetworkChaos -->
    <g transform="translate(20, 160)">
      <rect width="330" height="95" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <rect x="15" y="15" width="26" height="26" rx="4" fill="#fef3c7"/>
      <text x="28" y="33" text-anchor="middle" style="font-family: sans-serif; font-size: 12px; font-weight:bold; fill:#b45309;">N</text>
      <text x="50" y="26" class="node-title">NetworkChaos (latency / loss / partition)</text>
      <text x="50" y="40" class="node-tag" style="fill:#b45309;">NETWORK IMPAIRMENT</text>
      <text x="15" y="65" class="node-desc">Injects 150ms delay, 5% packet loss, cross-AZ partitions via tc-netem</text>
      <text x="15" y="82" class="node-desc">Validates client retries, gRPC deadlines, and circuit breakers</text>
    </g>

    <!-- StressChaos -->
    <g transform="translate(20, 265)">
      <rect width="330" height="95" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
      <rect x="15" y="15" width="26" height="26" rx="4" fill="#ede9fe"/>
      <text x="28" y="33" text-anchor="middle" style="font-family: sans-serif; font-size: 12px; font-weight:bold; fill:#6366f1;">S</text>
      <text x="50" y="26" class="node-title">StressChaos (CPU / Memory Exhaustion)</text>
      <text x="50" y="40" class="node-tag" style="fill:#6366f1;">RESOURCE PRESSURE</text>
      <text x="15" y="65" class="node-desc">Spins 4 CPU stress workers (85% load) and 1Gi memory pressure</text>
      <text x="15" y="82" class="node-desc">Verifies HPA autoscaling triggers and Linux OOM-killer resilience</text>
    </g>

    <!-- Workflow -->
    <g transform="translate(20, 370)">
      <rect width="330" height="95" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
      <rect x="15" y="15" width="26" height="26" rx="4" fill="#ccfbf1"/>
      <text x="28" y="33" text-anchor="middle" style="font-family: sans-serif; font-size: 12px; font-weight:bold; fill:#0d9488;">W</text>
      <text x="50" y="26" class="node-title">Workflow (Multi-Stage Pipeline)</text>
      <text x="50" y="40" class="node-tag" style="fill:#0d9488;">STAGE-GATED CHAOS</text>
      <text x="15" y="65" class="node-desc">Chains NetworkDelay ➔ PodKill ➔ StressChaos in orchestrated sequence</text>
      <text x="15" y="82" class="node-desc">Provides step timeouts, execution dependencies, and rollback hooks</text>
    </g>
  </g>

  <!-- Arrow: Injections -> Targets -->
  <path d="M 730 320 L 790 320" class="chaos-arrow" marker-end="url(#arrow-red)"/>

  <!-- 3. Target Applications & Observability Loop -->
  <g transform="translate(790, 140)">
    <rect x="0" y="0" width="350" height="500" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="25" y="30" class="group-title">3. Target Systems &amp; Safeguards</text>

    <!-- Target Workloads -->
    <g transform="translate(20, 55)">
      <rect width="310" height="175" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="20" y="25" class="node-title">Monitored Kubernetes Workloads</text>
      <text x="20" y="50" class="node-desc">🌐 <b>Ingress / API Gateway:</b> Traffic shifting &amp; fallback</text>
      <text x="20" y="75" class="node-desc">⚙️ <b>Order &amp; Checkout Services:</b> Istio circuit breakers</text>
      <text x="20" y="100" class="node-desc">🗄️ <b>Database / Cache:</b> Reconnection backoff &amp; pools</text>
      <text x="20" y="125" class="node-desc">📦 <b>Async Workers:</b> RabbitMQ / Kafka DLQ recovery</text>
      <text x="20" y="155" class="node-tag">Target Namespaces: [production, staging]</text>
    </g>

    <!-- Safety Circuit Breaker -->
    <g transform="translate(20, 245)">
      <rect width="310" height="225" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
      <text x="20" y="25" class="node-title">SRE Safety Circuit Breaker</text>
      <text x="20" y="45" class="node-tag" style="fill:#0d9488;">CONTINUOUS ERROR BUDGET MONITOR</text>

      <g transform="translate(15, 60)">
        <rect width="280" height="35" rx="4" fill="#f0fdf4"/>
        <text x="12" y="22" style="font-family: monospace; font-size: 11px; font-weight:bold; fill:#166534;">SLI Error Rate &lt; 1.0%</text>
      </g>

      <g transform="translate(15, 105)">
        <rect width="280" height="35" rx="4" fill="#f0fdf4"/>
        <text x="12" y="22" style="font-family: monospace; font-size: 11px; font-weight:bold; fill:#166534;">P99 Latency &lt; 500ms</text>
      </g>

      <text x="20" y="165" class="node-desc">• Auto-Aborts experiment upon violation</text>
      <text x="20" y="185" class="node-desc">• Automatic CRD cleanup &amp; network reset</text>
      <text x="20" y="205" class="node-desc">• Dispatches alerts to Alertmanager P1</text>
    </g>
  </g>
</svg>
