apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: random-pod-kill
  namespace: chaos-testing
spec:
  action: pod-kill
  mode: fixed
  value: '1'
  selector:
    namespaces:
      - production
    labelSelectors:
      app: api-gateway
  duration: '5m'
  scheduler:
    cron: '@every 2h'
