apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: egress-latency-chaos
  namespace: chaos-testing
spec:
  action: delay
  mode: fixed
  value: '2'
  selector:
    namespaces:
      - production
    labelSelectors:
      app: order-service
  delay:
    latency: '150ms'
    jitter: '20ms'
    correlation: '50'
  loss:
    loss: '5'
    correlation: '25'
  duration: '10m'
  direction: to
  target:
    selector:
      namespaces:
        - production
      labelSelectors:
        app: payment-service
    mode: all
